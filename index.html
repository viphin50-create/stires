<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор стикеров для Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .upload-area p {
            margin: 10px 0;
            font-size: 0.9em;
        }
        input[type="file"] {
            display: none;
        }
        #preview {
            width: 100%;
            height: 300px;
            background: #333;
            border-radius: 12px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #preview img {
            max-width: 100%;
            max-height: 100%;
        }
        .text-input {
            margin-bottom: 20px;
        }
        .text-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .text-input input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
        }
        .text-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a6fd8;
        }
        #downloadBtn {
            margin-top: 10px;
            background: #4CAF50;
        }
        #downloadBtn:hover {
            background: #45a049;
        }
        #downloadBtn:disabled {
            background: #888;
            cursor: not-allowed;
        }
        .error {
            color: #ff5252;
            font-size: 0.9em;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор стикеров для Telegram</h1>

        <div class="upload-area" id="uploadArea">
            <label for="fileInput">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M7.5 1a.5.5 0 0 1 .379.817L7 2.5V14h1V2.5l.879-.682A.5.5 0 0 1 9 2.5v11h1V2.5a.5.5 0 0 1 .121-.379L12 1H7.5zm2 13V9h-1v5H4V9h-1v5a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1z"/>
                    <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
                </svg>
                <p>Нажмите, чтобы выбрать изображение</p>
                <p style="font-size: 0.8em; color: #aaa;">(PNG/JPG, до 5 МБ)</p>
            </label>
            <input type="file" id="fileInput" accept="image/png, image/jpeg">
        </div>

        <div
